function openModal(title,body,confirmLabel=null){
 // 대화상자를 새 요소로 교체해 이전 close 이벤트가 새 확인 요청을
 // 잘못 승인하는 경합을 막습니다. 확인 Promise는 한 번만 완료됩니다.
 const previous=$('#dialog');
 if(modalResolver)modalResolver(false);
 if(previous.open)previous.close('cancel');
 const dialog=previous.cloneNode(false);dialog.removeAttribute('open');
 dialog.innerHTML='<h2 id="dialogTitle" class="dialog-title"></h2><div id="dialogBody" class="dialog-body"></div><div id="dialogActions" class="dialog-actions"></div>';
 previous.replaceWith(dialog);
 $('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;
 $('#dialogActions').innerHTML=confirmLabel?`<button class="btn" data-modal="cancel">취소</button><button class="btn primary" data-modal="ok">${h(confirmLabel)}</button>`:'<button class="btn primary" data-modal="ok">확인</button>';
 return new Promise(resolve=>{
  let settled=false;
  const settle=ok=>{if(settled)return;settled=true;if(modalResolver===settle)modalResolver=null;resolve(ok);};
  modalResolver=settle;
  dialog.addEventListener('click',e=>{const button=e.target.closest('[data-modal]');if(button)dialog.close(button.dataset.modal);});
  dialog.addEventListener('cancel',()=>{dialog.returnValue='cancel';});
  dialog.addEventListener('close',()=>settle(dialog.returnValue==='ok'),{once:true});
  dialog.showModal();
 });
}
function bookmark(id){const i=store.bookmarks.indexOf(id);if(i<0)store.bookmarks.push(id);else store.bookmarks.splice(i,1);save();return i<0;}
const mastered=id=>(store.stats[id]?.streak||0)>=2;
const wrongNeeded=id=>!!store.stats[id]&&store.stats[id].wrong>0&&!mastered(id);
function totals(){
 const s=Object.values(store.stats),learned=s.length,first=s.filter(x=>x.first).length;
 return{learned,first,mastered:BANK.filter(q=>mastered(q.id)).length,wrong:BANK.filter(q=>wrongNeeded(q.id)).length,attempts:s.reduce((a,x)=>a+x.attempts,0),correct:s.reduce((a,x)=>a+x.correct,0)};
}
function pool(config=store.config){
 const mode=config.mode;
 if(mode==='exam')return BANK.filter(q=>!q.support);
 let p=BANK.filter(q=>(config.support||!q.support)&&(!config.level||q.level===config.level));
 if(mode==='bow')p=p.filter(q=>q.tags.includes('BoW'));
 else p=p.filter(q=>config.cats.includes(q.cat));
 if(mode==='code')p=p.filter(q=>q.tags.includes('계산')||q.tags.includes('코드'));
 if(mode==='weak')p=p.filter(q=>!mastered(q.id));
 if(mode==='wrong')p=p.filter(q=>wrongNeeded(q.id));
 if(mode==='bookmarked')p=p.filter(q=>store.bookmarks.includes(q.id));
 return p;
}
function selectIds(config){
 const p=pool(config);
 if(config.mode==='exam'){
  const selected=[];
  for(const cat of CAT_ORDER){
   let candidates=shuffle(p.filter(q=>q.cat===cat));const tag=cat==='lr'?'경사하강법':cat==='nb'?'BoW':null;
   if(tag){const forced=candidates.find(q=>q.tags.includes(tag));if(forced){selected.push(forced.id);candidates=candidates.filter(q=>q.id!==forced.id);selected.push(...candidates.slice(0,QUOTA[cat]-1).map(q=>q.id));continue;}}
   selected.push(...candidates.slice(0,QUOTA[cat]).map(q=>q.id));
  }
  return shuffle(selected);
 }
 let candidates=shuffle(p);
 if(config.mode==='weak'){
  const priority=q=>{const s=store.stats[q.id];return !s?80:(s.wrong>0?100:35)+(2-s.streak)*8+10*(1-s.correct/s.attempts);};
  candidates.sort((a,b)=>priority(b)-priority(a));
 }
 const n=config.count==='all'?candidates.length:Math.min(config.count,candidates.length);
 return candidates.slice(0,n).map(q=>q.id);
}

 // 다음 미응답 문항만 채점하여 재방문·중복 이벤트로 기록이 바뀌지 않게 합니다.
 if(s.index!==Object.keys(s.answers).length)return;
 checkpoint();const now=new Date().toISOString(),correct=choice===q.answer;
 s.answers[id]={choice,correct,at:now,elapsed:s.elapsedMs};
 const prev=store.stats[id]||{attempts:0,correct:0,wrong:0,streak:0,first:correct,lastChoice:choice,lastAt:now};
 store.stats[id]={attempts:prev.attempts+1,correct:prev.correct+(correct?1:0),wrong:prev.wrong+(correct?0:1),streak:correct?prev.streak+1:0,first:prev.first,lastChoice:choice,lastAt:now};
 save();renderQuiz('feedback');
 // 요약만 읽어 주고, 상세 해설은 독자가 탐색할 수 있도록 별도 포커스를 둡니다.
 const display=s.orders[id].indexOf(q.answer)+1;
 toast(correct?'정답 · 해설도 확인해 보세요.':`오답 · 정답 ${display}번 — 아래 해설 확인`);
}

function finish(){
 const s=store.active;if(!s||Object.keys(s.answers).length!==s.ids.length)return;stopClock();

}

function renderLab(){

 }catch(err){openModal('가져오지 못했습니다.',`<p>${h(err.message)}</p><p>현재 기록은 변경하지 않았습니다.</p>`);}
});
function showHelp(){return openModal('게임 이용 방법',`<p><strong>모든 모드에서 답을 고르면 즉시 채점</strong>합니다. 오답이면 정답, 선택한 보기가 틀린 이유, 핵심 해설을 보여 줍니다. “5개 보기 모두 해설”에서 모든 선택지를 비교할 수 있습니다.</p><h3>학습 흐름</h3><ol><li>자유 연습으로 범위를 훑고, BoW·계산·코드 모드로 필요한 부분을 집중 연습합니다.</li><li>모르겠는 문항은 “모르겠어요”를 누릅니다. 오답으로 기록되고 해설을 확인할 수 있습니다.</li><li>오답은 다른 회차에서 2회 연속 맞힐 때까지 복습 목록에 남습니다. 다시 틀리면 연속 기록이 0으로 돌아갑니다.</li><li>시험 비중 14문항은 3·3·4·4로 출제하며, 모든 답변의 해설은 즉시 나옵니다. 실제 시험 문항·시간을 재현한 것은 아닙니다.</li></ol><h3>채점과 저장</h3><p>한 문항은 한 회차에서 한 번만 채점합니다. 이전 문항으로 돌아가도 답은 바꿀 수 없습니다. “저장하고 홈”으로 나가면 시간 측정이 멈추고 나중에 이어 풀 수 있습니다. 다른 화면·숨겨진 탭에서는 시간을 누적하지 않습니다. 해설을 읽는 시간은 학습 시간에 포함합니다.</p><p>문항마다 최초 응답을 별도로 기록한 <strong>첫 시도 정확도</strong>와 반복 응답을 모두 포함한 <strong>누적 정확도</strong>는 다릅니다. 정답 한 번당 10XP, 150XP마다 레벨이 1 오릅니다. 이 수치는 학습용이지 시험 성적의 보장이 아닙니다.</p><h3>키보드·백업</h3><p>1–5: 보기 선택 · N 또는 Enter: 다음 문제 · B: 북마크. 메모·검색·대화상자 입력 중에는 단축키가 답을 고르지 않습니다. 다른 기기로 옮기기 전 학습 기록 메뉴에서 JSON 백업을 저장하세요.</p>`);}
function showSources(){return openModal('문항의 자료 기준과 한계',`<p>문제은행은 첨부 강의 6개와 앞서 만든 64쪽 총정리·4쪽 압축 노트, 사용자가 전달한 시험 범위 및 과제 1–5를 바탕으로 새로 작성했습니다.</p><h3>원본 자료</h3><p>Ch01_머신러닝의 기초.pdf (66쪽)<br>Ch02_데이터의 이해.pdf (30쪽)<br>Ch03_넘파이.pdf (79쪽)<br>Ch04_판다스.pdf (71쪽)<br>Ch07_선형회귀의 기초.pdf (54쪽)<br>나이브 베이지안 분류기.pdf (62쪽)</p><h3>출처 배지</h3><p>“강의 기반”은 원문 개념·수식·예제, “강의식 응용”은 그 식으로 만든 새로운 수치 문제입니다. “총정리 보충/검산/구분 기준”은 앞선 총정리에서 원문과 구별했던 내용을 뜻합니다. 원문과 표현이 충돌하는 문항은 조건·기준을 문항과 해설에 명시했습니다. 원문과 총정리의 구분이 필요한 경우, 문제에 제시된 정의·수식을 기준으로 풀어 주세요.</p><p>각 문항 하단의 출처 쪽수는 PDF 실제 페이지입니다. 원본 PDF를 HTML 안에 내장하지는 않았으며, 출처는 찾아볼 위치를 표시합니다.</p><h3>시험과 과제</h3><p>문제은행: 머신러닝 24 · 데이터 32 · 선형회귀 48 · 나이브 베이즈 56 = 160문항. 이 중 보조 범위 11문항은 실제 시험 비중 모드에서 제외합니다. 단원마다 실제 출제된다고 확정한 문항은 없습니다.</p><p>Auto MPG 실제 데이터·본인의 제출 코드·대규모 20newsgroup의 실제 실행 결과는 제공되지 않았습니다. 따라서 예시 피쳐를 검증된 최적 조합으로 보거나, 창작 수치를 실제 학습 성능으로 해석하면 안 됩니다.</p><p><strong>실제 중간고사 문제나 만점을 보장하는 자료는 아닙니다.</strong> 정답 이유를 설명하고 손계산·코드를 재현하는 연습에 사용하세요.</p>`);}
function applyTheme(){document.documentElement.dataset.theme=store.theme;$('#themeToggle').setAttribute('aria-label',store.theme==='dark'?'밝은 테마로 변경':'어두운 테마로 변경');}
function expandAll(){root.querySelectorAll('details').forEach(el=>el.open=true);}
function printReview(){expandAll();window.print();}
window.addEventListener('beforeprint',()=>{printOpenStates=Array.from(root.querySelectorAll('details')).map(d=>[d,d.open]);expandAll();});
window.addEventListener('afterprint',()=>{for(const [d,was] of printOpenStates)if(d.isConnected)d.open=was;printOpenStates=[];});
function refreshBookmarkButton(id,el){const yes=store.bookmarks.includes(id);el.textContent=yes?'★ 저장됨':'☆ 북마크';el.classList.toggle('soft',yes);el.setAttribute('aria-pressed',String(yes));}

// 버튼 이벤트는 하나의 위임 핸들러에서 처리합니다. 정답 중복 제출은 answer()에서도 방어합니다.
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
 switch(action){
 case'home':renderHome();break;
 case'theme':store.theme=store.theme==='dark'?'light':'dark';applyTheme();save();break;
 case'help':showHelp();break;
 case'sources':showSources();break;
 case'mode':collectConfig();store.config.mode=b.dataset.mode;save();renderHome(false);break;
 case'category':store.config={...store.config,mode:'practice',cats:[b.dataset.cat],level:0};save();renderHome(false);$('#studyBuilder').scrollIntoView({behavior:'smooth'});break;
 case'start':await startSession();break;
 case'resume':if(store.active&&!store.active.finished)renderQuiz('question');break;
 case'answer':answer(Number(b.dataset.choice));break;
 case'unknown':answer(-1);break;
 case'next':nextQuestion();break;
 case'previous':jump(store.active.index-1);break;
 case'jump':jump(Number(b.dataset.index));break;
 case'bookmark':{const yes=bookmark(b.dataset.id);refreshBookmarkButton(b.dataset.id,b);toast(yes?'북마크에 저장했습니다.':'북마크를 해제했습니다.');break;}
 case'library':libraryFilter={search:'',cat:'all',status:'all'};renderLibrary(true);break;
 case'wrongLibrary':libraryFilter={search:'',cat:'all',status:'wrong'};renderLibrary(true);break;
 case'libraryPrev':libraryPage--;updateLibrary();moveTop();break;
 case'libraryNext':libraryPage++;updateLibrary();moveTop();break;
 case'single':await startSession([b.dataset.id],'retry');break;
 case'lab':renderLab();break;
 case'bowStart':store.config={...store.config,mode:'bow',level:0,count:'all',support:true};await startSession();break;
 case'records':renderRecords();break;
 case'export':exportStore();break;
 case'import':$('#importFile').click();break;
 case'exportWrong':exportWrong();break;
 case'exportCorrupt':if(corruptRaw)download('ML_이전기록_복구용원본.txt',corruptRaw);break;
 case'lastResult':renderResult();moveTop();break;
 case'retry':{const s=store.active,ids=s.ids.filter(id=>!s.answers[id].correct);await startSession(ids,'retry');break;}
 case'again':await startSession();break;
 case'expand':expandAll();break;
 case'print':printReview();break;
 case'reset':{const ok=await openModal('이 게임의 기록을 모두 지울까요?','<p>정오답 기록, 메모, 북마크, 진행 중인 회차와 최근 결과를 삭제합니다. 백업하지 않은 기록은 되돌릴 수 없습니다.</p>','전체 초기화');if(ok){stopClock();const theme=store.theme;store=defaults();store.theme=theme;corruptRaw=null;save();renderHome();toast('이 게임의 학습 기록을 초기화했습니다.');}break;}
 }
});
document.addEventListener('change',e=>{
 const id=e.target.id;
 if(route==='home'&&(e.target.name==='category'||['questionCount','difficulty','includeSupport'].includes(id))){collectConfig();updateAvailability();}
 if(id==='onlyWrong'){resultWrongOnly=e.target.checked;renderResult();}
 if(id==='bankCat'||id==='bankStatus'){libraryFilter.cat=$('#bankCat').value;libraryFilter.status=$('#bankStatus').value;libraryPage=1;updateLibrary();}
 if(id==='labBinary')updateLab();
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='personalNote'){const qid=e.target.dataset.note;if(BY_ID.has(qid)){store.notes[qid]=e.target.value.slice(0,4000);save();}}
 if(id==='bankSearch'){libraryFilter.search=e.target.value;libraryPage=1;updateLibrary();}
 if(id==='labText')updateLab();
});
document.addEventListener('keydown',e=>{
 if(route!=='quiz'||$('#dialog').open||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
 const el=e.target;
 if(el.matches('input,textarea,select')||el.isContentEditable)return;
 const s=store.active;if(!s||s.finished)return;
 if(/^[1-5]$/.test(e.key)){e.preventDefault();answer(s.orders[s.ids[s.index]][Number(e.key)-1]);}
 else if(e.key.toLowerCase()==='n'){e.preventDefault();nextQuestion();}
 else if(e.key==='Enter'&&!el.closest('button,summary,a')){e.preventDefault();nextQuestion();}
 else if(e.key.toLowerCase()==='b'){e.preventDefault();const id=s.ids[s.index],yes=bookmark(id);const b=root.querySelector(`[data-action="bookmark"][data-id="${id}"]`);if(b)refreshBookmarkButton(id,b);toast(yes?'북마크에 저장했습니다.':'북마크를 해제했습니다.');}
});
window.addEventListener('beforeunload',()=>{checkpoint();save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopClock();save();}else if(route==='quiz')startClock();});
// 외부 통신 없이 새 탭에서 열린 게임과 저장 충돌이 생길 수 있으므로 자동 덮어쓰기는 하지 않습니다.
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)toast('다른 탭에서 기록이 변경되었습니다. 한 탭에서 학습하거나 새로고침해 최신 기록을 읽으세요.');});
applyTheme();updateStorageStatus();renderHome();
})();
</script>
</body>
</html>
